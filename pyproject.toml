[project]
name = "robin"
version = "0.1.0"
description = "Robin: a file-based AI agent org (chief of staff + department agents + skills) on the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robin = "robin.cli:main"

[tool.setuptools]
packages = ["robin", "robin.kb", "guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
